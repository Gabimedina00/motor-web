name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run check
      - name: Tests de datos y lógica
        run: npm test
      - name: Compilar clientes de ejemplo
        run: npm run build:ejemplos
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests en navegador y accesibilidad
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: test-results/
